name: ci

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  IMAGE: docker.io/mapway/tile-cache
  HARBOR_IMAGE: harbor.cangling.cn:22002/cangling/tile-cache

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: compile (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            docker_arch: amd64
          - name: aarch64
            os: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-release
          cache-on-failure: true
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Compile tile-cache
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: tile-cache-${{ matrix.docker_arch }}
          path: target/release/tile-cache
          if-no-files-found: error
          retention-days: 3

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Read crate version
        id: meta
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Layout binaries for TARGETARCH
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          cp artifacts/tile-cache-amd64/tile-cache binaries/amd64/
          cp artifacts/tile-cache-arm64/tile-cache binaries/arm64/
          chmod +x binaries/amd64/tile-cache binaries/arm64/tile-cache
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.HARBOR_IMAGE }}:latest
            ${{ env.HARBOR_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.HARBOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=tile-cache-image
          cache-to: type=gha,mode=max,scope=tile-cache-image
      - name: Export architecture-specific image archives
        env:
          RELEASE_IMAGE: ${{ env.HARBOR_IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          docker pull --platform linux/amd64 "$RELEASE_IMAGE"
          docker image save "$RELEASE_IMAGE" | gzip -1 > dist/tile-cache-amd64.tar.gz
          docker pull --platform linux/arm64 "$RELEASE_IMAGE"
          docker image save "$RELEASE_IMAGE" | gzip -1 > dist/tile-cache-arm64.tar.gz
      - name: Upload image archives to software site
        env:
          CANGLING_TOKEN: ${{ secrets.CANGLING_TOKEN }}
          SOFTWARE_TOKEN: ${{ secrets.SOFTWARE_TOKEN }}
        run: |
          for arch in amd64 arm64; do
            curl --fail-with-body --show-error --progress-bar -k -X POST \
              "https://soft.cangling.cn:22002/api/v1/software/upload" \
              -H "API-TOKEN: $CANGLING_TOKEN" \
              -F "token=$SOFTWARE_TOKEN" \
              -F "version=latest" \
              -F "name=tile-cache-${arch}.tar.gz" \
              -F "summary=Automatic release for version ${{ github.ref_name }}" \
              -F "os=linux" -F "arch=${arch}" \
              -F "file=@dist/tile-cache-${arch}.tar.gz"
          done
